# Supabase CLI — configuração do projeto RÉGUA
# Docs: https://supabase.com/docs/reference/cli/config
#
# Para vincular ao projeto remoto:
#   supabase link --project-ref SEU-PROJECT-REF
#
# Para rodar a migration no banco remoto:
#   supabase db push

[project]
project_id = "regua"  # substituir pelo Project ID do Supabase após criar o projeto

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[ingest]
enabled = true
port = 54324

[storage]
enabled = true
port = 54325

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
